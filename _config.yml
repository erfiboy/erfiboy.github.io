about_content: | # this will include new lines to allow paragraphs
  I am a **Ph.D. student in Computer Science at the University of Calgary**, co-supervised by
  [Prof. Majid Ghaderi](https://cspages.ucalgary.ca/~mghaderi/) (University of Calgary) and
  [Prof. Rachit Agarwal](https://www.cs.cornell.edu/~ragarwal/) (Cornell University). Before starting my Ph.D.,
  I was an M.Sc. student at the University of Calgary (GPA 4.0/4.0), and I received my B.Sc. in Electrical Engineering
  (Digital Systems) from **Sharif University of Technology**.

  My research focuses on **data center networking for AI clusters**: RDMA load balancing, collective communication
  (NCCL) performance, and programmable switches (SONiC/SAI). Before grad school I worked as a DevOps engineer at
  [Torob](https://torob.com/).

content:
  - title: Research Experience
    nav: Research
    layout: list
    content:
      - layout: left
        border: weak
        title: NCCL Performance Analysis
        sub_title: Ph.D. research with Prof. Rachit Agarwal (Cornell) and Prof. Majid Ghaderi (UCalgary)
        caption: Summer 2025 - Present
        link: https://www.cs.cornell.edu/~ragarwal/
        link_text: Prof. Rachit Agarwal
        description: |
          The NVIDIA Collective Communication Library (NCCL) is among the most widely adopted libraries for collective
          communication in distributed deep learning, yet its performance frequently falls short of peak efficiency.
          This research identifies and examines the key bottlenecks in NCCL's communication patterns in multi-GPU and
          multi-node training, aiming to understand the factors that lead to GPU idleness during distributed training
          of deep learning models and LLMs.
      - layout: left
        border: weak
        title: RDMA Load Balancing in AI Clusters
        sub_title: University of Calgary Network Lab, Prof. Majid Ghaderi
        caption: Fall 2023 - Present
        link: https://arxiv.org/abs/2506.08132
        link_text: Paper on arXiv
        description: |
          A host-level load-balancing framework that optimizes RDMA traffic in data center networks without requiring
          specialized hardware. The algorithm dynamically reroutes traffic, significantly improving network performance
          compared to traditional methods.

          - Implemented and evaluated in [NS-3](https://www.nsnam.org/) against host-based schemes (FlowBender, PLB) and
            switch-based schemes (CONGA, ConWeave, FlowLet) under both web and ML workloads.
          - Built a physical testbed with RoCEv2-enabled switches and Mellanox ConnectX-5 NICs; used libibverbs and
            librdmacm to generate traffic and deployed the algorithm on the servers for real-time evaluation.
          - Worked with [SONiC](https://azure.github.io/SONiC/) and the [Switch Abstraction Interface (SAI)](https://github.com/opencomputeproject/SAI):
            fixed MAC-related issues, resolved SONiC bugs, and enabled new features.
      - layout: left
        title: SD-WAN & Network Security
        sub_title: Sharif 5G Lab, Prof. Babak Khalaj
        caption: Spring 2022 - Fall 2023
        link: https://sharif.edu/~khalaj/
        link_text: Prof. Babak Khalaj
        description: |
          - Analyzed SD-WAN features of leading commercial products (Fortinet, Cisco Viptela, HPE Silver Peak, VMware
            VeloCloud) and ran extensive simulations to optimize SDN controllers connecting company branches to HQ,
            prioritizing critical traffic to reduce reliance on costly dedicated lines.
          - Developed a framework that monitors the network to detect DDoS attacks and drops malicious packets
            identified by the model.
