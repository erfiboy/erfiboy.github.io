about_content: | # this will include new lines to allow paragraphs
  Hi! I'm a Ph.D. student in Computer Science at the University of Calgary, where I work with
  [Prof. Majid Ghaderi](https://cspages.ucalgary.ca/~mghaderi/) at the University of Calgary and
  [Prof. Rachit Agarwal](https://www.cs.cornell.edu/~ragarwal/) at Cornell University.

  I work on **networking for distributed training**. Training today's large models spreads work across many
  GPUs and machines, and the network that connects them is often what holds everything back. I'm working on
  improving how these systems communicate, so that GPUs spend their time computing instead of waiting on the network.

  During my master's, I worked on **load balancing in data center networks**, which led to our paper
  [*Congestion-Aware Path Selection for Load Balancing in AI Clusters*](https://arxiv.org/abs/2506.08132).
  Before grad school, I studied Electrical Engineering at Sharif University of Technology and worked as a
  DevOps engineer at [Torob](https://torob.com/).

