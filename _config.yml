            icon: fab fa-github
            url: https://github.com/erfiboy/Deep-RL-For-IDS/tree/main
        description: |
          Developed an IDPS for IoT networks using ML (Random Forest, CNN, XGBoost) and deep RL (DDPG) to detect and
          mitigate DDoS and ransomware attacks.
      - layout: left
        title: Artificial Intelligence
        caption: AI Course Project
        additional_links:
          - title: GitHub repository
            icon: fab fa-github
            url: https://github.com/erfiboy/Artificial-Intelligence
        description: |
          Hands-on implementation of classic AI techniques covering search, decision-making, optimization, and machine learning:
          - **Find the Battery:** compared two search algorithms for finding an energy source in a maze.
          - **Decision Tree:** built and optimized a classifier on the Diabetes dataset.
          - **Genetic Programming:** solved function approximation problems with a genetic algorithm.
          - **MLP:** regression, classification, and denoising on the USPS dataset.
          - **SVM:** classification tasks on the USPS dataset.
