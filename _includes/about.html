<section class="section about-section" id="{{ site.about_title | default: 'About' | slugify }}">
  <div class="wrap">
    <h2 class="section-title">{{ site.about_title | default: "About" }}</h2>
    <div class="about-body">
      {{ site.about_content | strip | markdownify }}
    </div>
    {%- if site.interests -%}
      <div class="interests">
        <span class="interests-label">Research interests</span>
        <ul class="chips">
          {%- for interest in site.interests -%}
            <li class="chip">{{ interest }}</li>
          {%- endfor -%}
        </ul>
      </div>
    {%- endif -%}
  </div>
</section>
